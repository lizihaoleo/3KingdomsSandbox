<meta charset="utf-8">
<title>孤岛</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 军帐沙盘：深青灰底、金色号令；左栏舆图与群臣，右栏人物档案与编年史；窄屏单列。舆图是按《中国历史地图集》三国图描摹的矢量古地图 */
:root{
  --bg:#121619; --panel:#1a2024; --panel-2:#20272c; --sunk:#161c20; --line:#2c353b; --line-2:#3a454c;
  --ink:#ece6d8; --ink-2:#c9c3b5; --muted:#a3aca6; --dim:#6f7a80;
  --gold:#c9a25a; --gold-hi:#e2c07d; --gold-bg:#241f15; --on-gold:#121619;
  --shu:#57b48a; --wei:#7aa0dc; --wu:#e57c63; --good:#57b48a; --bad:#e57c63;
  /* 舆图：纸本古图配色，两种主题下一致 */
  --sea:#8ea7aa; --land:#c3b48f; --realm:#ddd0ae; --river:#4b7c90; --road:#7d6a48;
  --map-ink:#2a2116; --map-muted:#5e4d33; --halo:#ece1c3;
  --m-shu:#2f8a5e; --m-wei:#3d67aa; --m-wu:#c25434;
  --f-title:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}a:hover{color:var(--gold-hi)}
h1,h2,h3{text-wrap:balance}

/* 顶部 */
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.brand{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:56px;line-height:1;letter-spacing:.04em}
.when{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.when b{font-family:var(--f-serif);font-weight:700;font-size:20px;color:var(--gold)}
.when span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.when span em{font-style:normal;color:var(--ink);font-weight:500}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700;padding:0 20px}
.btn.primary:hover{background:var(--gold-hi)}
.btn[aria-expanded=true]{border-color:var(--gold);color:var(--gold)}
.decree{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.decree label{font-size:12px;color:var(--muted)}
.decree input{flex:1 1 260px;min-width:0;min-height:44px;padding:0 12px;font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line-2);border-radius:4px}
.hint{font-size:12px;color:var(--muted)}

nav.views{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;align-self:flex-start;max-width:100%;overflow-x:auto}
nav.views button{min-height:40px;padding:0 18px;border:0;border-radius:4px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
nav.views button[aria-current=page]{background:var(--gold);color:var(--on-gold)}

/* 三国 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.fact .nm{font-family:var(--f-serif);font-weight:700;font-size:24px}
.fact span{font-size:12px;color:var(--muted)}
.fact span b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.fact .trend{margin-left:auto}

.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.col-main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{margin:0;font-family:var(--f-serif);font-size:17px}
.card-h span{font-size:12px;color:var(--muted)}

/* 舆图 */
.map{position:relative;height:clamp(380px,64vh,660px);border-radius:4px;overflow:hidden;background:var(--sea)}
.map svg{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-x pan-y}
.map.zoomed svg{touch-action:none}
.map svg.drag{cursor:grabbing}
.map .ctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.map .ctl button{width:40px;height:40px;border-radius:4px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--panel) 92%,transparent);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.map .ctl button:hover{border-color:var(--gold)}
.cityinfo{position:absolute;left:10px;bottom:10px;max-width:min(320px,calc(100% - 20px));background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cityinfo h3{margin:0;font-family:var(--f-serif);font-size:16px;display:flex;align-items:center;gap:8px}
.cityinfo .who{display:flex;flex-wrap:wrap;gap:6px}
.cityinfo .who button{min-height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;font-family:var(--f-serif)}
.cityinfo .who button:hover{border-color:var(--gold)}
.city{cursor:pointer}
.city text{font-family:var(--f-serif);font-size:15px;font-weight:700;fill:var(--map-ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.city text .tr{font-family:var(--f-ui);font-size:11px;font-weight:400;fill:var(--map-muted)}
.city:hover .dot,.city.sel .dot{stroke:var(--gold);stroke-width:3}
.zhou{font-family:var(--f-serif);font-size:22px;letter-spacing:8px;fill:var(--map-muted);opacity:.5;pointer-events:none}
.foreign{font-family:var(--f-serif);font-size:18px;letter-spacing:6px;fill:var(--map-muted);opacity:.65;pointer-events:none}
.water{font-family:var(--f-serif);font-size:15px;letter-spacing:4px;fill:#2f5566;pointer-events:none}
.sealbl{font-family:var(--f-serif);font-size:24px;letter-spacing:14px;fill:#3e6270;opacity:.7;pointer-events:none}
.mtn{font-family:var(--f-serif);font-size:13px;letter-spacing:5px;fill:var(--map-muted);font-style:italic;opacity:.75;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* 群臣 */
.court{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.court button{min-height:52px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;display:flex;flex-direction:column;position:relative}
.court button:hover{border-color:var(--line-2)}
.court button.on{border-color:var(--gold)}
.court button[aria-pressed=true]{background:var(--gold-bg);box-shadow:inset 0 0 0 1px var(--gold)}
.court .n{display:flex;align-items:center;gap:6px}
.court .n i{width:8px;height:8px;border-radius:50%;flex:none}
.court .n b{font-family:var(--f-serif);font-size:15px}
.court .r{font-size:11px;color:var(--muted)}
.court .mail{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.court button.dead .n b{text-decoration:line-through;color:var(--muted)}
.court button.off{opacity:.55;border-style:dashed}
.court .next{position:absolute;right:22px;top:6px;font-size:10px;padding:0 5px;border-radius:3px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)}
.chron .cast{margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.chron .cast b{color:var(--gold);font-weight:500;margin-right:6px}

/* 人物 */
.who-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-h h2{margin:0;font-family:var(--f-serif);font-size:26px}
.who-h .meta{font-size:12px;color:var(--muted);margin-left:auto}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;color:var(--on-gold)}
.bio{margin:8px 0 0;color:var(--ink-2);font-size:13px}
.ptabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:6px;padding:4px;margin:14px 0 12px}
.ptabs button{min-height:44px;border:0;border-radius:4px;background:transparent;font-size:14px;font-weight:500}
.ptabs button[aria-selected=true]{background:var(--gold);color:var(--on-gold)}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.prose{margin:0;font-family:var(--f-serif);font-size:15px;line-height:1.9;background:var(--panel-2);padding:12px 14px;border-radius:4px;white-space:pre-wrap}
.empty{color:var(--muted);font-size:13px;margin:0}
.act-line{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:3px;white-space:nowrap}
.letter{font-size:13px;border:1px dashed var(--line-2);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.letter small{font-size:12px;color:var(--muted)}
.letter small.in{color:var(--gold)} .letter small.cut{color:var(--bad)}
.letter span{font-family:var(--f-serif)}
.stack{display:flex;flex-direction:column;gap:8px}
ul.mem{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.mem li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.mem li:last-child{border-bottom:0}
.rel{display:flex;flex-direction:column;gap:4px;padding:2px 0;background:none;border:0;text-align:left;width:100%}
.rel .top{display:flex;justify-content:space-between;gap:8px;width:100%}
.rel .top span{font-family:var(--f-serif)}
.rel .top b{font-variant-numeric:tabular-nums}
.rel .bar{height:6px;background:var(--panel-2);border-radius:3px;position:relative;width:100%}
.rel .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.rel .bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.rel:hover .top span{color:var(--gold)}

/* 编年史 */
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:36px;height:36px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-size:16px}
.pager button:disabled{opacity:.35;cursor:default}
.pager select{min-height:36px;font:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 8px;max-width:180px}
.chron h3{margin:0 0 6px;font-family:var(--f-serif);font-size:16px;color:var(--gold)}
.chron .dir{margin:0 0 8px;font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:4px 10px;display:inline-block}
.chron .sum{margin:0 0 12px;font-family:var(--f-serif);font-size:15px;line-height:1.9}
.chron .evs{display:flex;flex-direction:column;gap:8px}
.chron .ev{display:flex;gap:10px;align-items:baseline}
.chron .ev b{font-family:var(--f-serif);flex:none}
.chron .ev span{color:var(--ink-2)}
.linkbtn{margin-top:12px;background:none;border:0;padding:6px 0;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* 众人心思 */
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.page-h h2{margin:0;font-family:var(--f-serif);font-weight:700;font-size:30px}
.page-h .sub{font-size:13px;color:var(--muted)}
.seasons{list-style:none;margin:0;padding:0 0 4px;display:flex;gap:8px;overflow-x:auto}
.seasons button{min-height:44px;padding:4px 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.seasons button small{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.seasons button b{font-family:var(--f-serif);font-size:14px;font-weight:700}
.seasons button[aria-current=true]{background:var(--gold-bg);border-color:var(--gold)}
.seasons button[aria-current=true] small{color:var(--gold)}
.agents{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.agent-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agent-h i{width:10px;height:10px;border-radius:50%}
.agent-h b{font-family:var(--f-serif);font-size:18px}
.agent-h button{background:none;border:0;padding:0}
.agent-h .r{font-size:12px;color:var(--muted)}
.agent-h .tag{margin-left:auto}
.agent .t{margin:0;font-family:var(--f-serif);font-size:14px;line-height:1.8;color:var(--ink-2);white-space:pre-wrap}
.agent .s{font-size:13px}
.agent .s em{font-style:normal;color:var(--gold)}

/* 小传与关系图 */
.intro{margin:0;font-family:var(--f-serif);font-size:15px;line-height:1.9}
.ties{display:flex;flex-wrap:wrap;gap:6px}
.ties button{min-height:36px;padding:2px 10px;border-radius:18px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;display:flex;align-items:center;gap:6px}
.ties button:hover{border-color:var(--gold)}
.ties button b{font-family:var(--f-serif);font-weight:700}
.ties button span{color:var(--muted);font-size:12px}
details.spoil{margin-top:14px;font-size:13px;color:var(--ink-2)}
details.spoil summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
.graph-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.graph-main{flex:999 1 640px;min-width:0}
.graph-side{flex:1 1 320px;min-width:0}
.graph svg{display:block;width:100%;height:auto;max-height:80vh;background:var(--sunk);border-radius:4px}
.gnode{cursor:pointer}
.gnode text{font-family:var(--f-serif);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--sunk);stroke-width:3px}
.gnode.dim{opacity:.25}
.gnode.sel circle{stroke:var(--gold);stroke-width:3}
.gnode:focus-visible circle{stroke:var(--gold-hi);stroke-width:3}
.gedge{fill:none;transition:opacity .2s}
.gedge.dim{opacity:.06}
.glabel{font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--sunk);stroke-width:3px;pointer-events:none}
.gfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.gfilters button{min-height:36px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-size:13px}
.gfilters button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.glegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.glegend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}

/* 平行历史 */
.scroll-x{overflow-x:auto}
.matrix{display:grid;gap:6px;min-width:100%}
.matrix .hd{font-size:12px;color:var(--muted)}
.matrix .bn{display:flex;flex-direction:column;justify-content:center;min-width:0}
.matrix .bn b{font-family:var(--f-serif);font-size:16px;word-break:break-all}
.matrix .bn span{font-size:12px;color:var(--muted)}
.matrix .cell{min-height:72px;border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.5;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);text-align:left}
.matrix .cell:hover{border-color:var(--gold)}
.matrix .cell.shared{background:transparent;border-color:var(--panel-2);color:var(--dim)}
.matrix .cell.fork{background:var(--gold-bg);border-color:var(--gold);color:var(--ink)}
.matrix .gap{min-height:72px}
table.cmp{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}
table.cmp th{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500;font-size:12px;color:var(--muted);text-align:left}
table.cmp td{padding:10px;border-bottom:1px solid var(--panel-2);font-variant-numeric:tabular-nums}
table.cmp td:first-child{font-family:var(--f-serif)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--panel-2);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast code{font-family:ui-monospace,Menlo,monospace;background:var(--sunk);padding:2px 6px;border-radius:3px;user-select:all;color:var(--gold-hi)}
@media (max-width:640px){
  body{padding-block:16px 40px}
  .brand h1{font-size:42px}
  .map{height:auto;aspect-ratio:4/5;max-height:72vh}
  .fact{gap:12px}
  .page-h h2{font-size:24px}
  .city text{font-size:20px;stroke-width:5px}.city text .tr{font-size:14px}
  .zhou{font-size:28px}.foreign{font-size:22px}.water{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="brand">季汉推演</h1>
      <div class="when"><b id="date"></b><span id="when-sub"></span></div>
    </div>
    <div class="cmds">
      <button class="btn primary" type="button" data-cmd="/turn" id="btn-one">推演一季</button>
      <button class="btn" type="button" data-cmd="/turn 4" id="btn-many">连推一年</button>
      <button class="btn" type="button" id="decree-toggle" aria-expanded="false" aria-controls="decree">天命干预</button>
      <button class="btn" type="button" data-cmd="/outline">整理成大纲</button>
    </div>
  </header>
  <form class="decree" id="decree" hidden>
    <label for="decree-text" id="decree-label">下一季的天命</label>
    <input id="decree-text" type="text" placeholder="如：魏延在褒斜道截住了杨仪" autocomplete="off">
    <button class="btn primary" type="submit">复制命令</button>
    <span class="hint" id="decree-now"></span>
  </form>

  <nav class="views" aria-label="视图">
    <button type="button" data-view="map">沙盘</button>
    <button type="button" data-view="acts">众人心思</button>
    <button type="button" data-view="graph">关系图</button>
    <button type="button" data-view="roster">人物名册</button>
    <button type="button" data-view="branches">平行历史</button>
  </nav>

  <!-- 沙盘 -->
  <section id="v-map" data-v="map" class="view">
    <div class="facts" id="facts"></div>
    <div class="cols">
      <div class="col-main">
        <section class="card">
          <div class="card-h"><h2 id="map-title">天下舆图</h2><span id="map-note">圆大小为驻军（万）· 金圈为本季易手 · 拖动平移，滚轮或按钮缩放</span></div>
          <div class="map" id="map">
            <div class="ctl">
              <button type="button" id="zin" aria-label="放大">+</button>
